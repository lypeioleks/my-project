<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 2: Рух тіла під кутом</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<h2>Рух тіла під кутом до горизонту</h2>

<div class="controls">
    <label>Початкова швидкість (v0, м/с):</label>
    <input type="number" id="v0" value="50" min="0">

    <label>Кут (градуси):</label>
    <input type="number" id="angle" value="45" min="0" max="90">

    <label>Прискорення вільного падіння (g, м/с²):</label>
    <input type="number" id="g" value="9.8" min="0">

    <label>Колір траєкторії:</label>
    <input type="color" id="color" value="#0000ff">

    <button onclick="draw()">Побудувати траєкторію</button>
    <button onclick="clearGraph()">Очистити графік</button>
</div>

<svg width="800" height="500"></svg>

<script src="script.js"></script>
</body>
</html>
