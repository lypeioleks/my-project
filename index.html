<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 1</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        canvas {
            border: 1px solid black;
            margin-top: 20px;
        }

        input {
            margin: 5px;
        }
    </style>
</head>
<body>

<h2>Моделювання руху</h2>

<div>
    x0: <input id="x0" type="number" value="0">
    y0: <input id="y0" type="number" value="0">
    Кут: <input id="angle" type="number" value="30">
    Швидкість: <input id="velocity" type="number" value="50">
    Прискорення: <input id="acceleration" type="number" value="9.8"><br>
    Колір: <input id="color" type="color" value="#ff0000">
</div>

<button onclick="drawTrajectory()">Побудувати</button>
<button onclick="clearCanvas()">Очистити</button>

<br>

<canvas id="canvas" width="800" height="500"></canvas>

<script src="script.js"></script>

</body>
</html>
