<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Лаб 1 — Прямолінійний рух (SVG)</title>
</head>
<body>

<h2>Моделювання кінематики прямолінійного руху (SVG)</h2>

<svg width="800" height="200" style="border:1px solid black;">
    <circle id="ball" cx="50" cy="100" r="15" fill="red"/>
</svg>

<br><br>

Тип руху:
<select id="motionType">
    <option value="uniform">Рівномірний</option>
    <option value="accelerated">Рівноприскорений</option>
</select>

<br><br>

Швидкість (v₀): 
<input type="number" id="velocity" value="100">

<br><br>

Прискорення (a): 
<input type="number" id="acceleration" value="20">

<br><br>

<button onclick="start()">Старт</button>
<button onclick="stop()">Стоп</button>
<button onclick="reset()">Скинути</button>

<p id="info"></p>

<script src="svg_motion.js"></script>

</body>
</html>
